<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Samuel's Agents</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0f;font-family:'DM Mono','Courier New',monospace;color:#e2e8f0;height:100vh;overflow:hidden}
  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#1e2030;border-radius:2px}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  textarea{scrollbar-width:none}
  textarea::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback}=React;

const AGENTS={
  coordinator:{id:"coordinator",name:"Daily Coordinator",short:"DC",color:"#60A5FA",bg:"#1e3a5f",
    description:"Orchestrates all agents + manages your time",
    starters:["Plan my day — I have [X] hours, crit is [day], energy is [level]","I have 3 things due and 2 hours. Help me prioritise.","I didn't do what I planned yesterday. Reset me.","What should I work on RIGHT NOW?"],
    system:`You are Samuel's cognitive load manager and multi-agent coordinator. He is in Sem 2 MAUD, Bangalore. ADHD. Active social life. Works in bursts. Timetable: Studio (Mon+Thu 9-2), Conservation (Tue 10-1), Theories (Wed 9-11), GIS (Fri 10-1), Policy (Tue 2-5), Governance (Fri 2-5). You are the ORCHESTRATOR. When a task needs specialist knowledge, say: [CONSULT: AgentName] reason. INTELLIGENCE RULES: Protect high-focus windows for hardest tasks. Never schedule creative work after 9pm or right before social events. Deep work (thesis, GIS, design) vs shallow work (reading, formatting). Deadlines beat everything. Build in 10-15 min ADHD transition time. If he gives 5 things and 3 hours, tell him which 2 to drop and why. Energy rhythm: gym → high focus → social → low focus. START: Ask what's due soonest, what time he needs to leave, energy level. Give realistic time-boxed plan. CHALLENGE: You said you'd do X yesterday. Did you? If not — how do we redesign today?`},
  studio:{id:"studio",name:"Studio II",short:"ST",color:"#FB923C",bg:"#3d1f0a",
    description:"Ecology & Site Planning — Prasanna Rao + Vagish N",
    starters:["I have 30 mins before class. What should I work on?","Review my design argument: [paste here]","Crit is tomorrow. What's the minimum I need ready?","What's the ecological argument I'm missing?"],
    system:`You are Samuel's Urban Design Studio II critic. Faculty: Prasanna Rao + Vagish N. Focus: Ecology & Site Planning. ADHD, works in bursts. INTELLIGENCE RULES: Never accept first design idea. Ask: What's the ecological argument behind this decision? Force distinction between formal moves and ecological logic — they must align. If he proposes a form: what watershed? What soil load-bearing? What wind corridor? Design ignoring these is decoration. Systems thinking: site is a node in larger ecological, infrastructural, social flows. Precedents: McHarg's Design with Nature, Duany's transect, BIG's hedonistic sustainability, MVRDV. Before any crit: What is your thesis in one sentence? If he can't answer, design isn't ready. ADHD MODE: Ask time available → 20-min sprints → end with Next time, start here: ___. CRITICAL CHALLENGE: You're describing the design, not justifying it. Why THIS, not something else? If an image is shared, analyse it as a design drawing or site photo and give specific feedback.`},
  conservation:{id:"conservation",name:"Conservation",short:"CO",color:"#F87171",bg:"#3d1515",
    description:"Urban Conservation — Pankaj Modi",
    starters:["Explain HRIDAY vs what it actually does in Dwarka.","What conservation doctrine applies to [context]?","Help me write a conservation argument for my assignment.","What's the political economy of heritage designation?"],
    system:`You are Samuel's Urban Conservation sparring partner. Faculty: Pankaj Modi. ADHD — sharp, not long. INTELLIGENCE RULES: Full doctrine stack: Venice Charter 1964 → Burra Charter → Nara Document → UNESCO HUL 2011 → INTACH Charter 2004 → ASI. Always locate argument in this stack. Push tension: conservation vs living cities — a frozen heritage zone is failure. Distinguish: fabric conservation vs typological conservation vs intangible heritage. Dwarka: conservation status, HRIDAY actual vs claimed, political economy of designation. Failure modes: gentrification, community exclusion, tourism commodification. CRITICAL CHALLENGE: By whose authority? Under which charter? Who does this protect — the building or the community? If an image or PDF is shared, analyse it in conservation terms immediately.`},
  theories:{id:"theories",name:"Theories",short:"TH",color:"#34D399",bg:"#0a3d2a",
    description:"Contemporary Theories — Madhuri Rao",
    starters:["Explain Lefebvre's production of space in 3 bullets.","How does my Studio site challenge [theorist]'s argument?","What's the sharpest critique of Harvey's urbanisation thesis?","Give me ARGUMENT → CONTRADICTION → COUNTER for [thinker]."],
    system:`You are Samuel's theory interlocutor — not a summariser, a challenger. Faculty: Madhuri Rao. ADHD — no monologues ever. INTELLIGENCE RULES: Thinker map: Lefebvre → Harvey → Jacobs → Koolhaas → Sassen → Roy → Chatterjee → Appadurai → Scott → Venturi. Always: Thinker A → sharpest critic → what that debate reveals TODAY. Global South is not deviation from Western theory — it IS a theoretical site. Dwarka: what does Lefebvre say about sacred space production? Harvey on pilgrimage economy? FORMAT: CORE ARGUMENT → INTERNAL CONTRADICTION → COUNTER-THEORIST → APPLICATION TO HIS WORK. CRITICAL CHALLENGE: You've described what the theorist says. Do you agree? What does your site do to this argument — confirm or break it? If a PDF reading is shared, engage critically — don't summarise, argue with it.`},
  governance:{id:"governance",name:"Governance",short:"GV",color:"#A78BFA",bg:"#2d1a5e",
    description:"Urban Governance & Project Finance — Champaka Rajagopal",
    starters:["Who actually governs Dwarka and why does it matter?","Explain municipal finance in India — bullets only.","What does the 74th CAA actually change on the ground?","What's the governance failure mode in my Studio site?"],
    system:`You are Samuel's Urban Governance and Project Finance analyst. Faculty: Champaka Rajagopal. ADHD — bullets always, paragraphs never. INTELLIGENCE RULES: Full architecture: 74th CAA → ULB structure → state municipal acts → parastatal agencies → smart city SPVs. Money: property tax, SFC/CFC devolution, municipal bonds, AMRUT 2.0, Smart Cities Mission, PPP, TDR markets. Key insight: governance structure determines urban form. Show this connection always. Fiscal literacy: who pays? Which instrument? What timeframe? Dwarka: Devbhumi Dwarka district + Okha Municipal Council + State + Tourism ministry + Temple trust = governance problem. FORMAT: INSTITUTION → JURISDICTION → MONEY SOURCE → URBAN CONSEQUENCE → FAILURE POINT. CRITICAL CHALLENGE: Whose incentive structure perpetuates this? What would have to change politically — not just technically? If a policy document or PDF is shared, analyse its governance architecture immediately.`},
  policy:{id:"policy",name:"Policy",short:"PO",color:"#4ADE80",bg:"#0a3d1a",
    description:"Policy & Implementation — Brinda Sastry",
    starters:["What does the Gujarat TP Scheme actually do spatially?","Walk me through the regulatory pathway for [intervention].","What's the FSI/FAR situation in Dwarka?","What would Brinda Sastry pick apart in my argument?"],
    system:`You are Samuel's Policy and Implementation strategist. Faculty: Brinda Sastry. ADHD — lead with the answer, always. INTELLIGENCE RULES: Full toolkit: Development Plans → DCR/zoning → FSI/FAR → TDR → land pooling → Gujarat TP Scheme → heritage regulations → CRZ. Gujarat TP Scheme: land pooling, infrastructure finance, value capture — directly relevant to Dwarka. Push the gap: most urban design fails in regulatory translation, not concept. Value capture: betterment levy, development charges, TDR markets, premium FSI — these ARE design tools. Read regulations spatially: a zoning map is a design drawing. What urban form does FSI + setback produce? CRITICAL CHALLENGE: Walk through the regulatory pathway — which authority, under which act, three most likely failure points? If a regulation document or map image is shared, read it spatially.`},
  gis:{id:"gis",name:"GIS II",short:"GIS",color:"#FDE047",bg:"#3d3000",
    description:"GIS-II — SKM (QGIS)",
    starters:["I'm stuck on [step] in QGIS. Screen shows: [describe].","What data sources exist for Dwarka online?","What spatial question should my next layer answer?","Check my layer order — is it right?"],
    system:`You are Samuel's GIS-II technical instructor and spatial analyst. Faculty: SKM. Software: QGIS. ADHD — one step at a time, always. INTELLIGENCE RULES: Never dump multiple steps. One action → confirm → next. Spatial thinking first: what does this layer REVEAL? Dwarka data: OSM, Bhuvan NRSC (land use, DEM, satellite), Census 2011, HRIDAY GIS, Gujarat SLUD. Projection for Gujarat: WGS84 / UTM Zone 43N — always check first. Read your own map critically: what is it NOT showing? LAYER ORDER: 1.Base → 2.Roads → 3.Admin boundaries → 4.Water+flood → 5.Heritage buffers → 6.Social infra → 7.Economic activity. ONE STEP FORMAT: Open [menu] → click [tool] → set [parameter] → you should see [result]. Done? Tell me what you see. CRITICAL CHALLENGE: What spatial question is this layer answering? If you can't answer that, the layer doesn't belong. If a map image or screenshot is shared, analyse it — what's missing, what's wrong, what's good?`},
};

const ORDER=["coordinator","studio","conservation","theories","governance","policy","gis"];
const SK="samuel-agents-v3";
const AK="samuel-gemini-key";

function loadData(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):null}catch{return null}}
function saveData(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch{}}
function loadKey(){try{return localStorage.getItem(AK)||""}catch{return ""}}
function saveKey(k){try{localStorage.setItem(AK,k)}catch{}}

async function callGemini(apiKey,systemPrompt,messages){
  const contents=messages.map(m=>{
    if(m.role==="assistant") return{role:"model",parts:[{text:m.content||""}]};
    const parts=[];
    (m.files||[]).forEach(f=>{
      if(f.kind==="image"||f.kind==="pdf") parts.push({inline_data:{mime_type:f.mediaType,data:f.data}});
    });
    if(m.content) parts.push({text:m.content});
    if(parts.length===0) parts.push({text:"(no content)"});
    return{role:"user",parts};
  });
  const body={systemInstruction:{parts:[{text:systemPrompt}]},contents,generationConfig:{maxOutputTokens:1200,temperature:0.9}};
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.[0]?.text||"No response.";
}

function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);})}

function App(){
  const saved=loadData();
  const [apiKey,setApiKey]=useState(loadKey);
  const [keyInput,setKeyInput]=useState("");
  const [conversations,setConversations]=useState(()=>saved?.conversations||Object.fromEntries(ORDER.map(id=>[id,[]])));
  const [active,setActive]=useState("coordinator");
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [consulting,setConsulting]=useState([]);
  const [sharedCtx,setSharedCtx]=useState(saved?.sharedCtx||"");
  const [pending,setPending]=useState([]);
  const [showSettings,setShowSettings]=useState(false);
  const [copied,setCopied]=useState(false);
  const [tab,setTab]=useState("chat");
  const bottomRef=useRef(null);
  const fileRef=useRef(null);
  const taRef=useRef(null);

  const agent=AGENTS[active];
  const msgs=conversations[active]||[];

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"})},[conversations,loading,active]);
  useEffect(()=>{saveData({conversations,sharedCtx})},[conversations,sharedCtx]);

  function addMsgs(agentId,newMsgs){
    setConversations(prev=>{const u={...prev,[agentId]:[...(prev[agentId]||[]),...newMsgs]};saveData({conversations:u,sharedCtx});return u;});
  }

  async function handleFiles(e){
    const files=Array.from(e.target.files);
    const out=[];
    for(const f of files){
      const isImg=f.type.startsWith("image/"),isPdf=f.type==="application/pdf";
      if(!isImg&&!isPdf) continue;
      if(f.size>10*1024*1024) continue;
      const data=await fileToBase64(f);
      out.push({name:f.name,kind:isImg?"image":"pdf",mediaType:f.type,data,preview:isImg?`data:${f.type};base64,${data}`:null});
    }
    setPending(prev=>[...prev,...out]);
    e.target.value="";
  }

  async function consultOther(agentId,question){
    const a=AGENTS[agentId];if(!a) return null;
    setConsulting(prev=>[...prev,agentId]);
    try{
      const r=await callGemini(apiKey,a.system,[{role:"user",content:question,files:[]}]);
      setConsulting(prev=>prev.filter(id=>id!==agentId));
      return{agent:a.name,response:r};
    }catch{setConsulting(prev=>prev.filter(id=>id!==agentId));return null;}
  }

  async function send(overrideText){
    const text=(overrideText||input).trim();
    if((!text&&pending.length===0)||loading) return;
    if(!apiKey){alert("Please enter your Gemini API key in Settings first.");return;}
    setInput("");
    const filesToSend=[...pending];
    setPending([]);
    const userMsg={id:`${Date.now()}`,role:"user",content:text,files:filesToSend,attachments:filesToSend.map(f=>({name:f.name,kind:f.kind,preview:f.preview}))};
    const newMsgs=[...msgs,userMsg];
    addMsgs(active,[userMsg]);
    setLoading(true);
    try{
      let sys=agent.system;
      if(sharedCtx) sys+=`\n\nSHARED CONTEXT:\n${sharedCtx}`;
      let response=await callGemini(apiKey,sys,newMsgs);
      if(active==="coordinator"&&response.includes("[CONSULT:")){
        const matches=[...response.matchAll(/\[CONSULT:\s*(\w+)\]\s*([^\[]*)/gi)];
        const results=[];
        for(const m of matches){
          const name=m[1].toLowerCase();
          const reason=m[2].trim();
          const tid=ORDER.find(id=>id.includes(name)||AGENTS[id]?.name.toLowerCase().includes(name));
          if(tid){const r=await consultOther(tid,`${text}\n\nSpecific question: ${reason}`);if(r) results.push(r);}
        }
        if(results.length>0){
          const summary=results.map(r=>`[${r.agent}]: ${r.response}`).join("\n\n");
          const synth=await callGemini(apiKey,sys,[...newMsgs,{role:"assistant",content:response,files:[]},{role:"user",content:`Specialist responses:\n\n${summary}\n\nNow give Samuel a final synthesised action plan.`,files:[]}]);
          response=synth;
          setSharedCtx(prev=>`${prev}\n\n---\n${summary}`.slice(-3000));
        }
      }
      addMsgs(active,[{id:`${Date.now()}-a`,role:"assistant",content:response,files:[],attachments:[]}]);
    }catch(err){
      addMsgs(active,[{id:`${Date.now()}-e`,role:"assistant",content:`Error: ${err.message}. Check your API key in Settings.`,files:[],attachments:[]}]);
    }
    setLoading(false);
  }

  function onKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}

  function clearAgent(id){setConversations(prev=>{const u={...prev,[id]:[]};saveData({conversations:u,sharedCtx});return u;});}
  function clearAll(){const e=Object.fromEntries(ORDER.map(id=>[id,[]]));setConversations(e);setSharedCtx("");saveData({conversations:e,sharedCtx:""});}

  function exportChat(){
    const text=msgs.map(m=>{
      const who=m.role==="user"?"SAMUEL":agent.name.toUpperCase();
      const files=m.attachments?.length?` [${m.attachments.map(a=>a.name).join(", ")}]`:"";
      return `${who}${files}:\n${m.content}`;
    }).join("\n\n---\n\n");
    navigator.clipboard.writeText(text);
    setCopied(true);setTimeout(()=>setCopied(false),2000);
  }

  function saveApiKey(){if(keyInput.trim()){setApiKey(keyInput.trim());saveKey(keyInput.trim());setKeyInput("");setShowSettings(false);}}

  const totalMsgs=Object.values(conversations).reduce((s,m)=>s+m.length,0);

  // Setup screen
  if(!apiKey){
    return(
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",padding:"24px"}}>
        <div style={{maxWidth:"400px",width:"100%",background:"#0f0f1a",borderRadius:"16px",padding:"32px",border:"1px solid #1a1a2e"}}>
          <div style={{fontSize:"20px",fontWeight:"800",color:"#e2e8f0",marginBottom:"6px"}}>Samuel's Agents</div>
          <div style={{fontSize:"11px",color:"#475569",marginBottom:"24px"}}>MAUD Sem 2 · 7 AI agents · Powered by Gemini</div>
          <div style={{fontSize:"11px",color:"#64748b",marginBottom:"8px"}}>Enter your Gemini API key to get started</div>
          <input value={keyInput} onChange={e=>setKeyInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveApiKey()}
            placeholder="AIza..." type="password"
            style={{width:"100%",background:"#131320",border:"1px solid #1a1a2e",borderRadius:"8px",padding:"10px 14px",color:"#e2e8f0",fontSize:"12px",fontFamily:"inherit",outline:"none",marginBottom:"12px"}}/>
          <button onClick={saveApiKey} style={{width:"100%",background:"#60A5FA",border:"none",borderRadius:"8px",padding:"12px",color:"#0a0a0f",fontSize:"13px",fontWeight:"700",cursor:"pointer",fontFamily:"inherit"}}>
            Let's go →
          </button>
          <div style={{marginTop:"16px",padding:"12px",background:"#131320",borderRadius:"8px",border:"1px solid #1a1a2e"}}>
            <div style={{fontSize:"10px",color:"#475569",lineHeight:"1.7"}}>
              Get free key: <span style={{color:"#60A5FA"}}>aistudio.google.com</span> → sidebar → Get API key<br/>
              Your key is stored only in your browser. Never sent anywhere except Google.
            </div>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{display:"flex",height:"100vh",background:"#0a0a0f",overflow:"hidden"}}>

      {/* Sidebar */}
      <div style={{width:"200px",minWidth:"200px",background:"#0d0d18",borderRight:"1px solid #1a1a2e",display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"14px 12px 10px",borderBottom:"1px solid #1a1a2e"}}>
          <div style={{fontSize:"8px",color:"#334155",letterSpacing:"0.2em",textTransform:"uppercase"}}>MAUD Sem 2 · Bangalore</div>
          <div style={{fontSize:"13px",fontWeight:"800",color:"#e2e8f0",marginTop:"3px"}}>Samuel's Agents</div>
          <div style={{fontSize:"9px",color:"#334155",marginTop:"1px"}}>{totalMsgs} messages saved</div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"8px 6px",display:"flex",flexDirection:"column",gap:"2px"}}>
          {ORDER.map(id=>{
            const a=AGENTS[id];const isActive=active===id;
            const cnt=(conversations[id]||[]).filter(m=>m.role==="user").length;
            return(
              <button key={id} onClick={()=>{setActive(id);setShowSettings(false);}}
                style={{background:isActive?a.bg:"transparent",border:`1px solid ${isActive?a.color+"40":"transparent"}`,borderRadius:"8px",padding:"8px 9px",cursor:"pointer",textAlign:"left",transition:"all 0.1s",width:"100%"}}>
                <div style={{display:"flex",alignItems:"center",gap:"7px"}}>
                  <div style={{width:"24px",height:"24px",borderRadius:"5px",background:a.bg,border:`1px solid ${a.color}50`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"7px",fontWeight:"800",color:a.color,flexShrink:0}}>
                    {a.short}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:"11px",fontWeight:"700",color:isActive?a.color:"#64748b",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{a.name}</div>
                    {cnt>0&&<div style={{fontSize:"9px",color:"#334155"}}>{cnt} exchanges</div>}
                  </div>
                  {consulting.includes(id)&&<div style={{width:"5px",height:"5px",borderRadius:"50%",background:a.color,flexShrink:0}}/>}
                </div>
              </button>
            );
          })}
        </div>
        <div style={{borderTop:"1px solid #1a1a2e",padding:"8px 6px",display:"flex",gap:"4px"}}>
          <button onClick={()=>setShowSettings(!showSettings)}
            style={{flex:1,background:showSettings?"#1e2030":"transparent",border:"1px solid #1a1a2e",borderRadius:"6px",color:"#475569",fontSize:"10px",padding:"6px",cursor:"pointer",fontFamily:"inherit"}}>
            ⚙ Settings
          </button>
          <button onClick={exportChat}
            style={{flex:1,background:"transparent",border:"1px solid #1a1a2e",borderRadius:"6px",color:copied?"#34D399":"#475569",fontSize:"10px",padding:"6px",cursor:"pointer",fontFamily:"inherit"}}>
            {copied?"✓ Done":"⬆ Export"}
          </button>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>

        {showSettings?(
          <div style={{flex:1,overflowY:"auto",padding:"24px",background:"#0a0a0f"}}>
            <div style={{maxWidth:"480px"}}>
              <div style={{fontSize:"14px",fontWeight:"700",color:"#e2e8f0",marginBottom:"20px"}}>Settings</div>

              <div style={{fontSize:"10px",color:"#475569",marginBottom:"8px",letterSpacing:"0.1em"}}>GEMINI API KEY</div>
              <div style={{display:"flex",gap:"8px",marginBottom:"24px"}}>
                <input value={keyInput} onChange={e=>setKeyInput(e.target.value)} placeholder="Update API key..."
                  style={{flex:1,background:"#0f0f1a",border:"1px solid #1a1a2e",borderRadius:"8px",padding:"8px 12px",color:"#e2e8f0",fontSize:"11px",fontFamily:"inherit",outline:"none"}}/>
                <button onClick={saveApiKey}
                  style={{background:"#60A5FA",border:"none",borderRadius:"8px",padding:"8px 14px",color:"#0a0a0f",fontSize:"11px",fontWeight:"700",cursor:"pointer",fontFamily:"inherit"}}>
                  Save
                </button>
              </div>

              <div style={{fontSize:"10px",color:"#475569",marginBottom:"10px",letterSpacing:"0.1em"}}>CLEAR AGENT MEMORY</div>
              <div style={{display:"flex",flexDirection:"column",gap:"5px",marginBottom:"20px"}}>
                {ORDER.map(id=>{
                  const a=AGENTS[id];const cnt=(conversations[id]||[]).length;
                  return(
                    <div key={id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 12px",background:"#0f0f1a",borderRadius:"8px",border:"1px solid #1a1a2e"}}>
                      <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                        <div style={{fontSize:"10px",fontWeight:"700",color:a.color}}>{a.name}</div>
                        <div style={{fontSize:"9px",color:"#334155"}}>{cnt} msgs</div>
                      </div>
                      <button onClick={()=>clearAgent(id)}
                        style={{background:"#1a1a2e",border:"none",borderRadius:"4px",color:"#ef4444",fontSize:"10px",padding:"3px 8px",cursor:"pointer",fontFamily:"inherit"}}>
                        Clear
                      </button>
                    </div>
                  );
                })}
              </div>

              <button onClick={clearAll}
                style={{width:"100%",background:"#2d1515",border:"1px solid #ef444430",borderRadius:"8px",color:"#ef4444",fontSize:"12px",padding:"11px",cursor:"pointer",fontFamily:"inherit",fontWeight:"700",marginBottom:"16px"}}>
                Clear All Memory
              </button>

              <div style={{padding:"12px",background:"#0f0f1a",borderRadius:"8px",border:"1px solid #1a1a2e"}}>
                <div style={{fontSize:"10px",color:"#475569",marginBottom:"6px"}}>FILE SUPPORT</div>
                <div style={{fontSize:"10px",color:"#64748b",lineHeight:"1.7"}}>
                  Images: JPG, PNG, GIF, WEBP (max 10MB)<br/>
                  Documents: PDF (max 10MB)<br/>
                  Memory: Saved in browser, survives tab close<br/>
                  Files: Session only
                </div>
              </div>
            </div>
          </div>
        ):(
          <>
            {/* Header */}
            <div style={{padding:"12px 16px",borderBottom:"1px solid #1a1a2e",background:"#0d0d18",display:"flex",alignItems:"center",gap:"10px",flexShrink:0}}>
              <div style={{width:"30px",height:"30px",borderRadius:"7px",background:agent.bg,border:`1px solid ${agent.color}50`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"8px",fontWeight:"800",color:agent.color,flexShrink:0}}>
                {agent.short}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:"12px",fontWeight:"700",color:agent.color}}>{agent.name}</div>
                <div style={{fontSize:"10px",color:"#334155",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{agent.description}</div>
              </div>
              {consulting.length>0&&(
                <div style={{fontSize:"9px",color:"#60A5FA",background:"#1e3a5f",padding:"3px 8px",borderRadius:"20px",border:"1px solid #60A5FA20",flexShrink:0}}>
                  Asking {consulting.map(id=>AGENTS[id]?.short).join(" + ")}...
                </div>
              )}
              <button onClick={()=>clearAgent(active)}
                style={{background:"transparent",border:"1px solid #1a1a2e",borderRadius:"6px",color:"#334155",fontSize:"10px",padding:"4px 8px",cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>
                Clear
              </button>
            </div>

            {/* Messages */}
            <div style={{flex:1,overflowY:"auto",padding:"16px 16px 8px",display:"flex",flexDirection:"column",gap:"12px"}}>
              {msgs.length===0&&(
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"18px",paddingTop:"16px"}}>
                  <div style={{textAlign:"center"}}>
                    <div style={{width:"48px",height:"48px",borderRadius:"12px",background:agent.bg,border:`1px solid ${agent.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",fontWeight:"800",color:agent.color,margin:"0 auto 8px"}}>
                      {agent.short}
                    </div>
                    <div style={{fontSize:"11px",color:"#475569"}}>{active==="coordinator"?"Tell me your day. I'll coordinate the rest.":`${agent.name} ready.`}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:"5px",width:"100%",maxWidth:"460px"}}>
                    <div style={{fontSize:"8px",color:"#334155",letterSpacing:"0.15em",textAlign:"center",marginBottom:"2px"}}>QUICK STARTS</div>
                    {agent.starters.map((s,i)=>(
                      <button key={i} onClick={()=>send(s)}
                        style={{background:"#0f0f1a",border:`1px solid ${agent.color}20`,borderRadius:"8px",padding:"8px 12px",cursor:"pointer",textAlign:"left",color:"#64748b",fontSize:"11px",fontFamily:"inherit",lineHeight:"1.4",transition:"all 0.1s"}}>
                        {s}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {msgs.map((msg,i)=>(
                <div key={msg.id||i} style={{display:"flex",justifyContent:msg.role==="user"?"flex-end":"flex-start",gap:"7px",alignItems:"flex-start"}}>
                  {msg.role==="assistant"&&(
                    <div style={{width:"22px",height:"22px",borderRadius:"5px",background:agent.bg,border:`1px solid ${agent.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"7px",fontWeight:"800",color:agent.color,flexShrink:0,marginTop:"1px"}}>
                      {agent.short}
                    </div>
                  )}
                  <div style={{maxWidth:"78%",display:"flex",flexDirection:"column",gap:"4px",alignItems:msg.role==="user"?"flex-end":"flex-start"}}>
                    {msg.attachments?.map((att,ai)=>(
                      <div key={ai} style={{borderRadius:"8px",overflow:"hidden",border:`1px solid ${agent.color}20`,maxWidth:"180px"}}>
                        {att.preview?<img src={att.preview} alt={att.name} style={{display:"block",maxWidth:"180px",maxHeight:"130px",objectFit:"cover"}}/>:
                        <div style={{background:"#161625",padding:"7px 11px",fontSize:"10px",color:"#64748b",display:"flex",alignItems:"center",gap:"5px"}}>📄 {att.name}</div>}
                      </div>
                    ))}
                    {msg.content&&(
                      <div style={{padding:"9px 13px",borderRadius:msg.role==="user"?"13px 13px 3px 13px":"13px 13px 13px 3px",background:msg.role==="user"?`${agent.color}18`:"#131320",border:`1px solid ${msg.role==="user"?agent.color+"25":"#1a1a2e"}`,fontSize:"12px",lineHeight:"1.65",color:msg.role==="user"?"#e2e8f0":"#cbd5e1",whiteSpace:"pre-wrap",wordBreak:"break-word"}}>
                        {msg.content}
                      </div>
                    )}
                  </div>
                </div>
              ))}

              {loading&&(
                <div style={{display:"flex",gap:"7px",alignItems:"flex-start"}}>
                  <div style={{width:"22px",height:"22px",borderRadius:"5px",background:agent.bg,border:`1px solid ${agent.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"7px",fontWeight:"800",color:agent.color,flexShrink:0}}>
                    {agent.short}
                  </div>
                  <div style={{padding:"9px 13px",borderRadius:"13px 13px 13px 3px",background:"#131320",border:"1px solid #1a1a2e",display:"flex",gap:"4px",alignItems:"center"}}>
                    {[0,1,2].map(i=><div key={i} style={{width:"5px",height:"5px",borderRadius:"50%",background:agent.color,opacity:0.7,animation:`bounce 1s ${i*0.18}s infinite ease-in-out`}}/>)}
                  </div>
                </div>
              )}
              <div ref={bottomRef}/>
            </div>

            {/* Pending files */}
            {pending.length>0&&(
              <div style={{padding:"8px 16px 0",display:"flex",gap:"6px",flexWrap:"wrap",borderTop:"1px solid #1a1a2e"}}>
                {pending.map((f,i)=>(
                  <div key={i} style={{position:"relative",borderRadius:"7px",overflow:"hidden",border:`1px solid ${agent.color}30`}}>
                    {f.preview?<img src={f.preview} alt={f.name} style={{width:"48px",height:"48px",objectFit:"cover",display:"block"}}/>:
                    <div style={{width:"48px",height:"48px",background:"#131320",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"2px"}}>
                      <span style={{fontSize:"16px"}}>📄</span>
                      <span style={{fontSize:"7px",color:"#475569",maxWidth:"42px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</span>
                    </div>}
                    <button onClick={()=>setPending(prev=>prev.filter((_,j)=>j!==i))}
                      style={{position:"absolute",top:"2px",right:"2px",width:"14px",height:"14px",borderRadius:"50%",background:"#ef4444",border:"none",color:"white",fontSize:"9px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>
                      ×
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* Input */}
            <div style={{padding:"9px 16px 14px",background:"#0d0d18",borderTop:pending.length>0?"none":"1px solid #1a1a2e",flexShrink:0}}>
              <div style={{display:"flex",gap:"7px",alignItems:"flex-end",background:"#131320",border:`1px solid ${agent.color}25`,borderRadius:"11px",padding:"7px 9px 7px 13px"}}>
                <button onClick={()=>fileRef.current?.click()}
                  style={{background:"transparent",border:"none",color:"#334155",fontSize:"15px",cursor:"pointer",padding:"3px",display:"flex",alignItems:"center",flexShrink:0,transition:"color 0.1s"}}
                  onMouseEnter={e=>e.currentTarget.style.color=agent.color}
                  onMouseLeave={e=>e.currentTarget.style.color="#334155"}
                  title="Attach image or PDF">📎</button>
                <input ref={fileRef} type="file" accept="image/*,.pdf" multiple onChange={handleFiles} style={{display:"none"}}/>
                <textarea ref={taRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={onKey}
                  placeholder={active==="coordinator"?"What's your day? What's due?":`Ask ${agent.name}...`}
                  rows={1}
                  style={{flex:1,background:"transparent",border:"none",outline:"none",color:"#e2e8f0",fontSize:"12px",fontFamily:"inherit",resize:"none",lineHeight:"1.5",maxHeight:"100px",overflowY:"auto"}}
                  onInput={e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,100)+"px";}}/>
                <button onClick={()=>send()} disabled={loading||(!input.trim()&&pending.length===0)}
                  style={{width:"28px",height:"28px",borderRadius:"7px",background:(loading||(!input.trim()&&pending.length===0))?"#1a1a2e":agent.color,border:"none",cursor:(loading||(!input.trim()&&pending.length===0))?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"background 0.15s"}}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={(loading||(!input.trim()&&pending.length===0))?"#334155":"#0a0a0f"} strokeWidth="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                  </svg>
                </button>
              </div>
              <div style={{fontSize:"9px",color:"#1e2030",marginTop:"4px",textAlign:"center"}}>
                Enter to send · Shift+Enter new line · 📎 image or PDF · memory auto-saved
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
