<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Samuel's Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F3;
  --surface:#FFFFFF;
  --sidebar:#EFEDE8;
  --border:#E5E2DA;
  --text:#1C1B18;
  --text-2:#6B6860;
  --text-3:#A8A59E;
  --accent:#1C1B18;
}
body{background:var(--bg);font-family:'Sora',sans-serif;color:var(--text);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
textarea{scrollbar-width:none}
textarea::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp 0.4s ease forwards}
button{cursor:pointer;font-family:'Sora',sans-serif}
input,textarea{font-family:'Sora',sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;

const FLASH_MODEL="gemini-3.1-flash-lite";
const PRO_MODEL="gemini-3.1-pro";
const HULK_TRIGGER="hulk smash";

const AGENTS={
  coordinator:{id:"coordinator",name:"Daily Coordinator",short:"DC",
    color:"#2563EB",chip:"#EFF6FF",chipText:"#1D4ED8",
    description:"Orchestrates all agents · manages your time",
    starters:["Plan my day — I have [X] hours, crit is [day], energy is [level]","I have 3 things due and 2 hours. Help me prioritise.","I didn't do what I planned yesterday. Reset me.","What should I work on RIGHT NOW?"],
    system:`You are Samuel's cognitive load manager and multi-agent coordinator. He is in Sem 2 MAUD, Bangalore. ADHD. Active social life. Works in bursts. Timetable: Studio (Mon+Thu 9-2), Conservation (Tue 10-1), Theories (Wed 9-11), GIS (Fri 10-1), Policy (Tue 2-5), Governance (Fri 2-5). You are the ORCHESTRATOR. When a task needs specialist knowledge, say: [CONSULT: AgentName] reason. INTELLIGENCE RULES: Protect high-focus windows for hardest tasks. Never schedule creative work after 9pm or right before social events. Deep work vs shallow work — schedule accordingly. Deadlines beat everything. Build in 10-15 min ADHD transition time. If 5 things and 3 hours, tell him which 2 to drop and why. Energy rhythm: gym → high focus → social → low focus. START: Ask what's due soonest, what time he needs to leave, energy level. Give realistic time-boxed plan. Not aspirational. CHALLENGE: You said you'd do X yesterday. Did you? If not — how do we redesign today?`},
  studio:{id:"studio",name:"Studio II",short:"ST",
    color:"#D97706",chip:"#FFFBEB",chipText:"#B45309",
    description:"Ecology & Site Planning · Prasanna Rao + Vagish N",
    starters:["I have 30 mins before class. What should I work on?","Review my design argument: [paste here]","Crit is tomorrow. What's the minimum I need ready?","What's the ecological argument I'm missing?"],
    system:`You are Samuel's Urban Design Studio II critic and thinking partner. Faculty: Prasanna Rao + Vagish N. Focus: Ecology & Site Planning. ADHD, works in bursts. INTELLIGENCE RULES: Never accept first design idea. Ask: What's the ecological argument behind this decision? Force distinction between formal moves and ecological logic — they must align. If he proposes a form: what watershed? What soil load-bearing? What wind corridor? Design ignoring these is decoration. Systems thinking: site is a node in larger ecological, infrastructural, social flows. Precedents: McHarg's Design with Nature, Duany's transect, BIG's hedonistic sustainability, MVRDV. Before any crit: What is your thesis in one sentence? If he can't answer, design isn't ready. ADHD MODE: Ask time available → 20-min sprints → end with Next time, start here. CRITICAL CHALLENGE: You're describing the design, not justifying it. Why THIS, not something else? If an image is shared, analyse it as a design drawing or site photo and give specific feedback.`},
  conservation:{id:"conservation",name:"Conservation",short:"CO",
    color:"#DC2626",chip:"#FEF2F2",chipText:"#B91C1C",
    description:"Urban Conservation · Pankaj Modi",
    starters:["Explain HRIDAY vs what it actually does in Dwarka.","What conservation doctrine applies to [context]?","Help me write a conservation argument for my assignment.","What's the political economy of heritage designation?"],
    system:`You are Samuel's Urban Conservation intellectual sparring partner. Faculty: Pankaj Modi. ADHD — sharp, not long. INTELLIGENCE RULES: Full doctrine stack: Venice Charter 1964 → Burra Charter → Nara Document → UNESCO HUL 2011 → INTACH Charter 2004 → ASI. Always locate argument in this stack. Push tension: conservation vs living cities — a frozen heritage zone is failure. Distinguish: fabric conservation vs typological conservation vs intangible heritage. Dwarka: conservation status, HRIDAY actual vs claimed, political economy of designation. Failure modes: gentrification, community exclusion, tourism commodification. CRITICAL CHALLENGE: By whose authority? Under which charter? Who does this protect — the building or the community? If an image or PDF is shared, analyse it in conservation terms immediately.`},
  theories:{id:"theories",name:"Theories",short:"TH",
    color:"#059669",chip:"#ECFDF5",chipText:"#047857",
    description:"Contemporary Theories · Madhuri Rao",
    starters:["Explain Lefebvre's production of space in 3 bullets.","How does my Studio site challenge [theorist]'s argument?","What's the sharpest critique of Harvey's urbanisation thesis?","Give me ARGUMENT → CONTRADICTION → COUNTER for [thinker]."],
    system:`You are Samuel's theory interlocutor — not a summariser, a challenger. Faculty: Madhuri Rao. ADHD — no monologues ever. INTELLIGENCE RULES: Thinker map: Lefebvre → Harvey → Jacobs → Koolhaas → Sassen → Roy → Chatterjee → Appadurai → Scott → Venturi. Always: Thinker A → sharpest critic → what that debate reveals TODAY. Global South is not deviation from Western theory — it IS a theoretical site. Dwarka: what does Lefebvre say about sacred space production? Harvey on pilgrimage economy? FORMAT: CORE ARGUMENT → INTERNAL CONTRADICTION → COUNTER-THEORIST → APPLICATION TO HIS WORK. CRITICAL CHALLENGE: You've described what the theorist says. Do you agree? What does your site do to this argument — confirm or break it? If a PDF reading is shared, engage critically — don't summarise, argue with it.`},
  governance:{id:"governance",name:"Governance",short:"GV",
    color:"#7C3AED",chip:"#F5F3FF",chipText:"#6D28D9",
    description:"Urban Governance & Finance · Champaka Rajagopal",
    starters:["Who actually governs Dwarka and why does it matter?","Explain municipal finance in India — bullets only.","What does the 74th CAA actually change on the ground?","What's the governance failure mode in my Studio site?"],
    system:`You are Samuel's Urban Governance and Project Finance analyst. Faculty: Champaka Rajagopal. ADHD — bullets always, paragraphs never. INTELLIGENCE RULES: Full architecture: 74th CAA → ULB structure → state municipal acts → parastatal agencies → smart city SPVs. Money: property tax, SFC/CFC devolution, municipal bonds, AMRUT 2.0, Smart Cities Mission, PPP, TDR markets. Key insight: governance structure determines urban form. Show this connection always. Fiscal literacy: who pays? Which instrument? What timeframe? Dwarka: Devbhumi Dwarka district + Okha Municipal Council + State + Tourism ministry + Temple trust = governance problem. FORMAT: INSTITUTION → JURISDICTION → MONEY SOURCE → URBAN CONSEQUENCE → FAILURE POINT. CRITICAL CHALLENGE: Whose incentive structure perpetuates this? What would have to change politically — not just technically? If a policy document or PDF is shared, analyse its governance architecture immediately.`},
  policy:{id:"policy",name:"Policy",short:"PO",
    color:"#0891B2",chip:"#ECFEFF",chipText:"#0E7490",
    description:"Policy & Implementation · Brinda Sastry",
    starters:["What does the Gujarat TP Scheme actually do spatially?","Walk me through the regulatory pathway for [intervention].","What's the FSI/FAR situation in Dwarka?","What would Brinda Sastry pick apart in my argument?"],
    system:`You are Samuel's Policy and Implementation strategist. Faculty: Brinda Sastry. ADHD — lead with the answer, always. INTELLIGENCE RULES: Full toolkit: Development Plans → DCR/zoning → FSI/FAR → TDR → land pooling → Gujarat TP Scheme → heritage regulations → CRZ. Gujarat TP Scheme: land pooling, infrastructure finance, value capture — directly relevant to Dwarka. Push the gap: most urban design fails in regulatory translation, not concept. Value capture: betterment levy, development charges, TDR markets, premium FSI — these ARE design tools. Read regulations spatially: a zoning map is a design drawing. What urban form does FSI + setback produce? CRITICAL CHALLENGE: Walk through the regulatory pathway — which authority, under which act, three most likely failure points? If a regulation document or map image is shared, read it spatially.`},
  gis:{id:"gis",name:"GIS II",short:"GIS",
    color:"#92400E",chip:"#FEF3C7",chipText:"#78350F",
    description:"GIS-II · SKM (QGIS)",
    starters:["I'm stuck on [step] in QGIS. Screen shows: [describe].","What data sources exist for Dwarka online?","What spatial question should my next layer answer?","Check my layer order — is it right?"],
    system:`You are Samuel's GIS-II technical instructor and spatial analyst. Faculty: SKM. Software: QGIS. ADHD — one step at a time, always. INTELLIGENCE RULES: Never dump multiple steps. One action → confirm → next. Spatial thinking first: what does this layer REVEAL? Dwarka data: OSM, Bhuvan NRSC (land use, DEM, satellite), Census 2011, HRIDAY GIS, Gujarat SLUD. Projection for Gujarat: WGS84 / UTM Zone 43N — always check first. Read your own map critically: what is it NOT showing? LAYER ORDER: 1.Base → 2.Roads → 3.Admin boundaries → 4.Water+flood → 5.Heritage buffers → 6.Social infra → 7.Economic activity. ONE STEP FORMAT: Open [menu] → click [tool] → set [parameter] → you should see [result]. Done? Tell me what you see. CRITICAL CHALLENGE: What spatial question is this layer answering? If you can't answer that, the layer doesn't belong. If a map image or screenshot is shared, analyse it — what's missing, what's wrong, what's good?`},
};

const ORDER=["coordinator","studio","conservation","theories","governance","policy","gis"];
const SK="samuel-agents-v4";
const AK="samuel-gemini-key-v2";

function loadData(){try{const s=localStorage.getItem(SK);return s?JSON.parse(s):null}catch{return null}}
function saveData(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch{}}
function loadKey(){try{return localStorage.getItem(AK)||""}catch{return""}}
function saveKey(k){try{localStorage.setItem(AK,k)}catch{}}

function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);})}

async function callGemini(apiKey,systemPrompt,messages,useProModel){
  const model=useProModel?PRO_MODEL:FLASH_MODEL;
  const contents=messages.map(m=>{
    if(m.role==="assistant") return{role:"model",parts:[{text:m.content||""}]};
    const parts=[];
    (m.files||[]).forEach(f=>{parts.push({inline_data:{mime_type:f.mediaType,data:f.data}});});
    if(m.content) parts.push({text:m.content});
    if(parts.length===0) parts.push({text:"(no content)"});
    return{role:"user",parts};
  });
  const body={systemInstruction:{parts:[{text:systemPrompt}]},contents,generationConfig:{maxOutputTokens:1200,temperature:0.9}};
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await res.json();
  if(data.error) throw new Error(data.error.message);
  return{text:data.candidates?.[0]?.content?.parts?.[0]?.text||"No response.",model};
}

// NotebookLM notebooks config
const NOTEBOOKS=[
  {id:"studio",name:"Studio II",url:"https://notebooklm.google.com"},
  {id:"conservation",name:"Conservation",url:"https://notebooklm.google.com"},
  {id:"theories",name:"Theories",url:"https://notebooklm.google.com"},
  {id:"governance",name:"Governance",url:"https://notebooklm.google.com"},
  {id:"policy",name:"Policy",url:"https://notebooklm.google.com"},
  {id:"gis",name:"GIS II",url:"https://notebooklm.google.com"},
];

function App(){
  const saved=loadData();
  const [apiKey,setApiKey]=useState(loadKey);
  const [keyInput,setKeyInput]=useState("");
  const [conversations,setConversations]=useState(()=>saved?.conversations||Object.fromEntries(ORDER.map(id=>[id,[]])));
  const [active,setActive]=useState("coordinator");
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [consulting,setConsulting]=useState([]);
  const [sharedCtx,setSharedCtx]=useState(saved?.sharedCtx||"");
  const [pending,setPending]=useState([]);
  const [view,setView]=useState("chat"); // chat | settings | notebooks
  const [copied,setCopied]=useState(false);
  const [lastModel,setLastModel]=useState(null);
  const [notebookUrls,setNotebookUrls]=useState(()=>{try{return JSON.parse(localStorage.getItem("nb-urls")||"{}")}catch{return{}}});
  const [nbPaste,setNbPaste]=useState("");
  const [hulkActive,setHulkActive]=useState(false);
  const bottomRef=useRef(null);
  const fileRef=useRef(null);
  const taRef=useRef(null);

  const agent=AGENTS[active];
  const msgs=conversations[active]||[];

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"})},[conversations,loading,active]);
  useEffect(()=>{saveData({conversations,sharedCtx})},[conversations,sharedCtx]);

  function addMsgs(agentId,newMsgs){
    setConversations(prev=>{const u={...prev,[agentId]:[...(prev[agentId]||[]),...newMsgs]};saveData({conversations:u,sharedCtx});return u;});
  }

  async function handleFiles(e){
    const files=Array.from(e.target.files);const out=[];
    for(const f of files){
      const isImg=f.type.startsWith("image/"),isPdf=f.type==="application/pdf";
      if(!isImg&&!isPdf) continue;if(f.size>10*1024*1024) continue;
      const data=await fileToBase64(f);
      out.push({name:f.name,kind:isImg?"image":"pdf",mediaType:f.type,data,preview:isImg?`data:${f.type};base64,${data}`:null});
    }
    setPending(prev=>[...prev,...out]);e.target.value="";
  }

  async function consultOther(agentId,question){
    const a=AGENTS[agentId];if(!a) return null;
    setConsulting(prev=>[...prev,agentId]);
    try{
      const r=await callGemini(apiKey,a.system,[{role:"user",content:question,files:[]}],false);
      setConsulting(prev=>prev.filter(id=>id!==agentId));
      return{agent:a.name,response:r.text};
    }catch{setConsulting(prev=>prev.filter(id=>id!==agentId));return null;}
  }

  async function send(overrideText){
    const text=(overrideText||input).trim();
    if((!text&&pending.length===0)||loading) return;
    if(!apiKey){alert("Enter your Gemini API key in Settings first.");return;}
    const isHulk=text.toLowerCase().includes(HULK_TRIGGER);
    if(isHulk) setHulkActive(true);
    setInput("");
    const filesToSend=[...pending];setPending([]);
    const userMsg={id:`${Date.now()}`,role:"user",content:text,files:filesToSend,attachments:filesToSend.map(f=>({name:f.name,kind:f.kind,preview:f.preview}))};
    const newMsgs=[...msgs,userMsg];
    addMsgs(active,[userMsg]);setLoading(true);
    try{
      let sys=agent.system;
      if(sharedCtx) sys+=`\n\nSHARED CONTEXT:\n${sharedCtx}`;
      if(nbPaste) sys+=`\n\nNOTEBOOKLM CONTEXT (user pasted):\n${nbPaste}`;
      const{text:response,model:usedModel}=await callGemini(apiKey,sys,newMsgs,isHulk);
      setLastModel(usedModel);
      if(active==="coordinator"&&response.includes("[CONSULT:")){
        const matches=[...response.matchAll(/\[CONSULT:\s*(\w+)\]\s*([^\[]*)/gi)];
        const results=[];
        for(const m of matches){
          const name=m[1].toLowerCase();const reason=m[2].trim();
          const tid=ORDER.find(id=>id.includes(name)||AGENTS[id]?.name.toLowerCase().includes(name));
          if(tid){const r=await consultOther(tid,`${text}\n\nSpecific question: ${reason}`);if(r) results.push(r);}
        }
        if(results.length>0){
          const summary=results.map(r=>`[${r.agent}]: ${r.response}`).join("\n\n");
          const synth=await callGemini(apiKey,sys,[...newMsgs,{role:"assistant",content:response,files:[]},{role:"user",content:`Specialist responses:\n\n${summary}\n\nGive Samuel a final synthesised action plan.`,files:[]}],isHulk);
          addMsgs(active,[{id:`${Date.now()}-a`,role:"assistant",content:synth.text,files:[],attachments:[],model:synth.model,hulk:isHulk}]);
          setSharedCtx(prev=>`${prev}\n\n---\n${summary}`.slice(-3000));
          setLoading(false);if(isHulk) setHulkActive(false);return;
        }
      }
      addMsgs(active,[{id:`${Date.now()}-a`,role:"assistant",content:response,files:[],attachments:[],model:usedModel,hulk:isHulk}]);
    }catch(err){
      addMsgs(active,[{id:`${Date.now()}-e`,role:"assistant",content:`Error: ${err.message}`,files:[],attachments:[]}]);
    }
    setLoading(false);if(isHulk) setHulkActive(false);
  }

  function onKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}
  function clearAgent(id){setConversations(prev=>{const u={...prev,[id]:[]};saveData({conversations:u,sharedCtx});return u;});}
  function clearAll(){const e=Object.fromEntries(ORDER.map(id=>[id,[]]));setConversations(e);setSharedCtx("");saveData({conversations:e,sharedCtx:""});}
  function exportChat(){
    const text=msgs.map(m=>{const who=m.role==="user"?"SAMUEL":agent.name.toUpperCase();return `${who}:\n${m.content}`;}).join("\n\n---\n\n");
    navigator.clipboard.writeText(text);setCopied(true);setTimeout(()=>setCopied(false),2000);
  }
  function saveNbUrl(id,url){const u={...notebookUrls,[id]:url};setNotebookUrls(u);try{localStorage.setItem("nb-urls",JSON.stringify(u))}catch{}}

  const totalMsgs=Object.values(conversations).reduce((s,m)=>s+m.length,0);

  // ─── LANDING / API KEY SCREEN ───────────────────────────────────────────────
  if(!apiKey){
    return(
      <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px"}}>
        <div style={{width:"100%",maxWidth:"440px"}}>
          {/* Logo area */}
          <div style={{marginBottom:"48px"}}>
            <div style={{fontSize:"13px",fontWeight:"500",color:"var(--text-3)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:"12px"}}>
              MAUD Sem 2 · Bangalore
            </div>
            <h1 style={{fontFamily:"'Instrument Serif',serif",fontSize:"clamp(36px,6vw,52px)",fontWeight:"400",color:"var(--text)",lineHeight:"1.1",marginBottom:"8px"}}>
              Samuel's<br/><em style={{fontStyle:"italic",color:"var(--text-2)"}}>Agents</em>
            </h1>
            <p style={{fontSize:"14px",color:"var(--text-2)",lineHeight:"1.6",fontWeight:"300",marginTop:"16px"}}>
              7 specialist AI agents for your MAUD coursework.<br/>
              Powered by Gemini. Yours forever.
            </p>
          </div>

          {/* Agent chips */}
          <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"40px"}}>
            {ORDER.map(id=>{
              const a=AGENTS[id];
              return(
                <span key={id} style={{background:a.chip,color:a.chipText,fontSize:"11px",fontWeight:"600",padding:"4px 10px",borderRadius:"20px",letterSpacing:"0.02em"}}>
                  {a.name}
                </span>
              );
            })}
          </div>

          {/* API key form */}
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"16px",padding:"28px"}}>
            <div style={{fontSize:"12px",fontWeight:"600",color:"var(--text)",marginBottom:"6px",letterSpacing:"0.04em",textTransform:"uppercase"}}>
              Gemini API Key
            </div>
            <div style={{fontSize:"12px",color:"var(--text-2)",marginBottom:"16px",fontWeight:"300"}}>
              Get free key at <span style={{color:"#2563EB",fontWeight:"500"}}>aistudio.google.com</span> → Get API key
            </div>
            <input value={keyInput} onChange={e=>setKeyInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&keyInput.trim()&&(setApiKey(keyInput.trim()),saveKey(keyInput.trim()))}
              placeholder="AIza..." type="password"
              style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"10px",padding:"12px 14px",color:"var(--text)",fontSize:"13px",outline:"none",marginBottom:"12px",transition:"border-color 0.2s"}}
              onFocus={e=>e.target.style.borderColor="#2563EB"}
              onBlur={e=>e.target.style.borderColor="var(--border)"}/>
            <button
              onClick={()=>{if(keyInput.trim()){setApiKey(keyInput.trim());saveKey(keyInput.trim());}}}
              style={{width:"100%",background:"var(--text)",border:"none",borderRadius:"10px",padding:"13px",color:"white",fontSize:"13px",fontWeight:"600",letterSpacing:"0.02em",transition:"opacity 0.2s"}}
              onMouseEnter={e=>e.currentTarget.style.opacity="0.85"}
              onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
              Enter the room →
            </button>
          </div>

          <div style={{marginTop:"16px",fontSize:"11px",color:"var(--text-3)",textAlign:"center",fontWeight:"300"}}>
            Key stored only in your browser · never shared
          </div>
        </div>
      </div>
    );
  }

  // ─── MAIN APP ────────────────────────────────────────────────────────────────
  return(
    <div style={{display:"flex",height:"100vh",background:"var(--bg)",overflow:"hidden"}}>

      {/* ── Sidebar ── */}
      <div style={{width:"220px",minWidth:"220px",background:"var(--sidebar)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",overflow:"hidden"}}>

        {/* Header */}
        <div style={{padding:"20px 16px 16px",borderBottom:"1px solid var(--border)"}}>
          <div style={{fontFamily:"'Instrument Serif',serif",fontSize:"20px",color:"var(--text)",lineHeight:"1.1"}}>
            Samuel's<br/><em style={{fontStyle:"italic",color:"var(--text-2)"}}>Agents</em>
          </div>
          <div style={{fontSize:"10px",color:"var(--text-3)",marginTop:"6px",fontWeight:"400"}}>{totalMsgs} messages · MAUD Sem 2</div>
        </div>

        {/* Agent list */}
        <div style={{flex:1,overflowY:"auto",padding:"10px 8px",display:"flex",flexDirection:"column",gap:"2px"}}>
          {ORDER.map(id=>{
            const a=AGENTS[id];const isActive=active===id&&view==="chat";
            const cnt=(conversations[id]||[]).filter(m=>m.role==="user").length;
            return(
              <button key={id}
                onClick={()=>{setActive(id);setView("chat");}}
                style={{background:isActive?"var(--surface)":"transparent",border:`1px solid ${isActive?"var(--border)":"transparent"}`,borderRadius:"10px",padding:"9px 10px",textAlign:"left",transition:"all 0.15s",width:"100%",boxShadow:isActive?"0 1px 3px rgba(0,0,0,0.06)":""}}
                onMouseEnter={e=>{if(!isActive)e.currentTarget.style.background="rgba(0,0,0,0.04)"}}
                onMouseLeave={e=>{if(!isActive)e.currentTarget.style.background="transparent"}}>
                <div style={{display:"flex",alignItems:"center",gap:"9px"}}>
                  <div style={{width:"28px",height:"28px",borderRadius:"7px",background:a.chip,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"8px",fontWeight:"700",color:a.color,flexShrink:0,letterSpacing:"-0.01em"}}>
                    {a.short}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:"12px",fontWeight:isActive?"600":"400",color:isActive?"var(--text)":"var(--text-2)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                      {a.name}
                    </div>
                    {cnt>0&&<div style={{fontSize:"10px",color:"var(--text-3)",marginTop:"1px"}}>{cnt} exchanges</div>}
                  </div>
                  {consulting.includes(id)&&<div style={{width:"5px",height:"5px",borderRadius:"50%",background:a.color,animation:"pulse 1s infinite",flexShrink:0}}/>}
                </div>
              </button>
            );
          })}
        </div>

        {/* Bottom nav */}
        <div style={{borderTop:"1px solid var(--border)",padding:"10px 8px",display:"flex",flexDirection:"column",gap:"2px"}}>
          {[
            {id:"notebooks",icon:"◈",label:"NotebookLM"},
            {id:"settings",icon:"◎",label:"Settings"},
          ].map(item=>(
            <button key={item.id}
              onClick={()=>setView(v=>v===item.id?"chat":item.id)}
              style={{background:view===item.id?"var(--surface)":"transparent",border:`1px solid ${view===item.id?"var(--border)":"transparent"}`,borderRadius:"8px",padding:"8px 10px",textAlign:"left",width:"100%",display:"flex",alignItems:"center",gap:"8px",transition:"all 0.15s"}}
              onMouseEnter={e=>{if(view!==item.id)e.currentTarget.style.background="rgba(0,0,0,0.04)"}}
              onMouseLeave={e=>{if(view!==item.id)e.currentTarget.style.background="transparent"}}>
              <span style={{fontSize:"13px",color:"var(--text-2)"}}>{item.icon}</span>
              <span style={{fontSize:"12px",color:view===item.id?"var(--text)":"var(--text-2)",fontWeight:view===item.id?"600":"400"}}>{item.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* ── Main Panel ── */}
      <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>

        {/* ── SETTINGS VIEW ── */}
        {view==="settings"&&(
          <div style={{flex:1,overflowY:"auto",padding:"32px"}}>
            <div style={{maxWidth:"500px"}}>
              <h2 style={{fontFamily:"'Instrument Serif',serif",fontSize:"28px",fontWeight:"400",color:"var(--text)",marginBottom:"6px"}}>Settings</h2>
              <p style={{fontSize:"13px",color:"var(--text-2)",marginBottom:"32px",fontWeight:"300"}}>Manage your API key, memory, and preferences.</p>

              {/* API Key */}
              <div style={{marginBottom:"28px"}}>
                <div style={{fontSize:"11px",fontWeight:"600",color:"var(--text)",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Gemini API Key</div>
                <div style={{display:"flex",gap:"8px"}}>
                  <input value={keyInput} onChange={e=>setKeyInput(e.target.value)} placeholder="Update API key..."
                    style={{flex:1,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"8px",padding:"9px 12px",color:"var(--text)",fontSize:"12px",outline:"none"}}
                    onFocus={e=>e.target.style.borderColor="#2563EB"}
                    onBlur={e=>e.target.style.borderColor="var(--border)"}/>
                  <button onClick={()=>{if(keyInput.trim()){setApiKey(keyInput.trim());saveKey(keyInput.trim());setKeyInput("");}}}
                    style={{background:"var(--text)",border:"none",borderRadius:"8px",padding:"9px 16px",color:"white",fontSize:"12px",fontWeight:"600"}}>Save</button>
                </div>
              </div>

              {/* Model info */}
              <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"12px",padding:"16px",marginBottom:"28px"}}>
                <div style={{fontSize:"11px",fontWeight:"600",color:"var(--text)",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Model Config</div>
                <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:"12px",color:"var(--text-2)"}}>Default</span>
                    <span style={{fontSize:"11px",fontWeight:"600",color:"#059669",background:"#ECFDF5",padding:"2px 8px",borderRadius:"20px"}}>{FLASH_MODEL}</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:"12px",color:"var(--text-2)"}}>Hulk Smash 💪</span>
                    <span style={{fontSize:"11px",fontWeight:"600",color:"#DC2626",background:"#FEF2F2",padding:"2px 8px",borderRadius:"20px"}}>{PRO_MODEL}</span>
                  </div>
                </div>
                <div style={{fontSize:"11px",color:"var(--text-3)",marginTop:"10px",fontWeight:"300"}}>
                  Say "hulk smash" in any message to trigger the Pro model for that response.
                </div>
              </div>

              {/* Clear memory */}
              <div style={{marginBottom:"16px"}}>
                <div style={{fontSize:"11px",fontWeight:"600",color:"var(--text)",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Memory</div>
                <div style={{display:"flex",flexDirection:"column",gap:"4px",marginBottom:"12px"}}>
                  {ORDER.map(id=>{
                    const a=AGENTS[id];const cnt=(conversations[id]||[]).length;
                    return(
                      <div key={id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"var(--surface)",borderRadius:"8px",border:"1px solid var(--border)"}}>
                        <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                          <span style={{fontSize:"11px",fontWeight:"600",color:a.color}}>{a.name}</span>
                          <span style={{fontSize:"10px",color:"var(--text-3)"}}>{cnt} msgs</span>
                        </div>
                        <button onClick={()=>clearAgent(id)}
                          style={{background:"transparent",border:"1px solid #FCA5A5",borderRadius:"5px",color:"#DC2626",fontSize:"10px",padding:"3px 8px",fontWeight:"500"}}>
                          Clear
                        </button>
                      </div>
                    );
                  })}
                </div>
                <button onClick={clearAll}
                  style={{width:"100%",background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:"8px",color:"#DC2626",fontSize:"12px",padding:"10px",fontWeight:"600"}}>
                  Clear All Memory
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ── NOTEBOOKS VIEW ── */}
        {view==="notebooks"&&(
          <div style={{flex:1,overflowY:"auto",padding:"32px"}}>
            <div style={{maxWidth:"560px"}}>
              <h2 style={{fontFamily:"'Instrument Serif',serif",fontSize:"28px",fontWeight:"400",color:"var(--text)",marginBottom:"6px"}}>NotebookLM</h2>
              <p style={{fontSize:"13px",color:"var(--text-2)",marginBottom:"8px",fontWeight:"300"}}>Your subject knowledge bases. Open a notebook, copy insights, paste them below to ground your agents.</p>

              {/* Paste context */}
              <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"12px",padding:"20px",marginBottom:"24px"}}>
                <div style={{fontSize:"11px",fontWeight:"600",color:"var(--text)",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"8px"}}>Paste NotebookLM Context</div>
                <textarea value={nbPaste} onChange={e=>setNbPaste(e.target.value)} rows={4}
                  placeholder="Copy text from your NotebookLM notebook and paste here. All agents will use this as grounding context for the session..."
                  style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"8px",padding:"10px 12px",color:"var(--text)",fontSize:"12px",resize:"vertical",outline:"none",lineHeight:"1.6",fontFamily:"'Sora',sans-serif",fontWeight:"300"}}
                  onFocus={e=>e.target.style.borderColor="#2563EB"}
                  onBlur={e=>e.target.style.borderColor="var(--border)"}/>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"8px"}}>
                  <span style={{fontSize:"11px",color:nbPaste?"#059669":"var(--text-3)",fontWeight:nbPaste?"500":"300"}}>
                    {nbPaste?`${nbPaste.length} chars active — agents will use this`:"No context pasted yet"}
                  </span>
                  {nbPaste&&<button onClick={()=>setNbPaste("")} style={{background:"transparent",border:"none",color:"#DC2626",fontSize:"11px",fontWeight:"500"}}>Clear</button>}
                </div>
              </div>

              {/* Notebooks list */}
              <div style={{fontSize:"11px",fontWeight:"600",color:"var(--text)",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Your Notebooks</div>
              <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                {NOTEBOOKS.map(nb=>{
                  const a=AGENTS[nb.id];
                  return(
                    <div key={nb.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"10px",padding:"14px 16px",display:"flex",alignItems:"center",gap:"12px"}}>
                      <div style={{width:"32px",height:"32px",borderRadius:"8px",background:a.chip,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",fontWeight:"700",color:a.color,flexShrink:0}}>
                        {a.short}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:"13px",fontWeight:"500",color:"var(--text)",marginBottom:"4px"}}>{nb.name}</div>
                        <input value={notebookUrls[nb.id]||""} onChange={e=>saveNbUrl(nb.id,e.target.value)}
                          placeholder="Paste your NotebookLM URL here..."
                          style={{width:"100%",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:"5px",padding:"5px 8px",color:"var(--text-2)",fontSize:"11px",outline:"none",fontFamily:"'Sora',sans-serif"}}/>
                      </div>
                      <a href={notebookUrls[nb.id]||"https://notebooklm.google.com"} target="_blank" rel="noreferrer"
                        style={{background:"var(--text)",color:"white",fontSize:"11px",fontWeight:"600",padding:"6px 12px",borderRadius:"6px",textDecoration:"none",flexShrink:0,whiteSpace:"nowrap"}}>
                        Open →
                      </a>
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:"16px",padding:"12px 16px",background:"#EFF6FF",borderRadius:"8px",border:"1px solid #BFDBFE"}}>
                <div style={{fontSize:"11px",color:"#1D4ED8",lineHeight:"1.6",fontWeight:"400"}}>
                  <strong>How to use:</strong> Open notebook → ask a question or read a source → copy the answer → paste in the box above → your agents will use it as context in this session.
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── CHAT VIEW ── */}
        {view==="chat"&&(
          <>
            {/* Chat header */}
            <div style={{padding:"14px 20px",borderBottom:"1px solid var(--border)",background:"var(--surface)",display:"flex",alignItems:"center",gap:"12px",flexShrink:0}}>
              <div style={{width:"32px",height:"32px",borderRadius:"8px",background:agent.chip,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",fontWeight:"700",color:agent.color,flexShrink:0}}>
                {agent.short}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:"14px",fontWeight:"600",color:"var(--text)"}}>{agent.name}</div>
                <div style={{fontSize:"11px",color:"var(--text-3)",fontWeight:"300"}}>{agent.description}</div>
              </div>
              {lastModel&&(
                <div style={{fontSize:"10px",color:lastModel.includes("pro")?"#DC2626":"var(--text-3)",background:lastModel.includes("pro")?"#FEF2F2":"var(--bg)",padding:"3px 8px",borderRadius:"20px",border:"1px solid var(--border)",flexShrink:0,fontWeight:lastModel.includes("pro")?"600":"400"}}>
                  {lastModel.includes("pro")?"💪 PRO":"Flash Lite"}
                </div>
              )}
              {consulting.length>0&&(
                <div style={{fontSize:"10px",color:"#2563EB",background:"#EFF6FF",padding:"3px 10px",borderRadius:"20px",border:"1px solid #BFDBFE",flexShrink:0}}>
                  Asking {consulting.map(id=>AGENTS[id]?.short).join(" + ")}...
                </div>
              )}
              <div style={{display:"flex",gap:"6px",flexShrink:0}}>
                <button onClick={exportChat}
                  style={{background:"transparent",border:"1px solid var(--border)",borderRadius:"6px",color:copied?"#059669":"var(--text-2)",fontSize:"11px",padding:"5px 10px",fontWeight:"500"}}>
                  {copied?"✓":"Export"}
                </button>
                <button onClick={()=>clearAgent(active)}
                  style={{background:"transparent",border:"1px solid var(--border)",borderRadius:"6px",color:"var(--text-2)",fontSize:"11px",padding:"5px 10px",fontWeight:"500"}}>
                  Clear
                </button>
              </div>
            </div>

            {/* Messages */}
            <div style={{flex:1,overflowY:"auto",padding:"24px 20px 12px",display:"flex",flexDirection:"column",gap:"16px",background:"var(--bg)"}}>

              {msgs.length===0&&(
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"24px",paddingTop:"20px",animation:"fadeUp 0.4s ease"}}>
                  <div style={{textAlign:"center"}}>
                    <div style={{width:"56px",height:"56px",borderRadius:"14px",background:agent.chip,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",fontWeight:"700",color:agent.color,margin:"0 auto 12px",border:`1px solid ${agent.color}20`}}>
                      {agent.short}
                    </div>
                    <div style={{fontFamily:"'Instrument Serif',serif",fontSize:"22px",color:"var(--text)",marginBottom:"4px"}}>{agent.name}</div>
                    <div style={{fontSize:"12px",color:"var(--text-2)",fontWeight:"300"}}>{agent.description}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:"6px",width:"100%",maxWidth:"480px"}}>
                    <div style={{fontSize:"10px",fontWeight:"600",color:"var(--text-3)",letterSpacing:"0.1em",textTransform:"uppercase",textAlign:"center",marginBottom:"4px"}}>
                      Quick starts
                    </div>
                    {agent.starters.map((s,i)=>(
                      <button key={i} onClick={()=>send(s)}
                        style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"10px",padding:"11px 16px",textAlign:"left",color:"var(--text-2)",fontSize:"12px",fontWeight:"300",lineHeight:"1.5",transition:"all 0.15s",boxShadow:"0 1px 2px rgba(0,0,0,0.04)"}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor=agent.color+"60";e.currentTarget.style.color="var(--text)";}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.color="var(--text-2)";}}>
                        {s}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {msgs.map((msg,i)=>(
                <div key={msg.id||i} style={{display:"flex",justifyContent:msg.role==="user"?"flex-end":"flex-start",gap:"10px",alignItems:"flex-start",animation:"fadeUp 0.3s ease"}}>
                  {msg.role==="assistant"&&(
                    <div style={{width:"26px",height:"26px",borderRadius:"7px",background:agent.chip,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"8px",fontWeight:"700",color:agent.color,flexShrink:0,marginTop:"1px"}}>
                      {agent.short}
                    </div>
                  )}
                  <div style={{maxWidth:"76%",display:"flex",flexDirection:"column",gap:"4px",alignItems:msg.role==="user"?"flex-end":"flex-start"}}>
                    {msg.attachments?.map((att,ai)=>(
                      <div key={ai} style={{borderRadius:"10px",overflow:"hidden",border:"1px solid var(--border)",maxWidth:"200px",boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
                        {att.preview?<img src={att.preview} alt={att.name} style={{display:"block",maxWidth:"200px",maxHeight:"150px",objectFit:"cover"}}/>:
                        <div style={{background:"var(--surface)",padding:"8px 12px",fontSize:"11px",color:"var(--text-2)",display:"flex",alignItems:"center",gap:"6px"}}>📄 {att.name}</div>}
                      </div>
                    ))}
                    {msg.content&&(
                      <div style={{padding:"11px 15px",borderRadius:msg.role==="user"?"14px 14px 4px 14px":"14px 14px 14px 4px",background:msg.role==="user"?agent.chip:"var(--surface)",border:`1px solid ${msg.role==="user"?agent.color+"30":"var(--border)"}`,fontSize:"13px",lineHeight:"1.7",color:"var(--text)",whiteSpace:"pre-wrap",wordBreak:"break-word",fontWeight:"300",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
                        {msg.content}
                      </div>
                    )}
                    {msg.hulk&&<div style={{fontSize:"10px",color:"#DC2626",fontWeight:"600"}}>💪 Pro model used</div>}
                  </div>
                </div>
              ))}

              {loading&&(
                <div style={{display:"flex",gap:"10px",alignItems:"flex-start"}}>
                  <div style={{width:"26px",height:"26px",borderRadius:"7px",background:agent.chip,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"8px",fontWeight:"700",color:agent.color,flexShrink:0}}>
                    {agent.short}
                  </div>
                  <div style={{padding:"11px 15px",borderRadius:"14px 14px 14px 4px",background:"var(--surface)",border:"1px solid var(--border)",display:"flex",gap:"4px",alignItems:"center",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
                    {[0,1,2].map(i=><div key={i} style={{width:"5px",height:"5px",borderRadius:"50%",background:agent.color,opacity:0.6,animation:`bounce 1s ${i*0.18}s infinite ease-in-out`}}/>)}
                  </div>
                </div>
              )}
              <div ref={bottomRef}/>
            </div>

            {/* Pending files */}
            {pending.length>0&&(
              <div style={{padding:"8px 20px 0",display:"flex",gap:"8px",flexWrap:"wrap",background:"var(--bg)",borderTop:"1px solid var(--border)"}}>
                {pending.map((f,i)=>(
                  <div key={i} style={{position:"relative",borderRadius:"8px",overflow:"hidden",border:"1px solid var(--border)",boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
                    {f.preview?<img src={f.preview} alt={f.name} style={{width:"52px",height:"52px",objectFit:"cover",display:"block"}}/>:
                    <div style={{width:"52px",height:"52px",background:"var(--surface)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"2px"}}>
                      <span style={{fontSize:"18px"}}>📄</span>
                      <span style={{fontSize:"7px",color:"var(--text-3)",maxWidth:"44px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</span>
                    </div>}
                    <button onClick={()=>setPending(prev=>prev.filter((_,j)=>j!==i))}
                      style={{position:"absolute",top:"3px",right:"3px",width:"16px",height:"16px",borderRadius:"50%",background:"#1C1B18",border:"none",color:"white",fontSize:"9px",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>
                      ×
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* Input */}
            <div style={{padding:"10px 20px 16px",background:"var(--bg)",borderTop:pending.length>0?"none":"1px solid var(--border)",flexShrink:0}}>
              {nbPaste&&(
                <div style={{marginBottom:"8px",padding:"6px 10px",background:"#EFF6FF",border:"1px solid #BFDBFE",borderRadius:"7px",fontSize:"10px",color:"#1D4ED8",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span>◈ NotebookLM context active ({nbPaste.length} chars)</span>
                  <button onClick={()=>setNbPaste("")} style={{background:"transparent",border:"none",color:"#2563EB",fontSize:"10px",fontWeight:"600",cursor:"pointer"}}>Clear</button>
                </div>
              )}
              <div style={{display:"flex",gap:"8px",alignItems:"flex-end",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"12px",padding:"9px 10px 9px 14px",boxShadow:"0 1px 4px rgba(0,0,0,0.06)",transition:"border-color 0.2s"}}
                onFocusCapture={e=>e.currentTarget.style.borderColor=agent.color+"80"}
                onBlurCapture={e=>e.currentTarget.style.borderColor="var(--border)"}>
                <button onClick={()=>fileRef.current?.click()}
                  style={{background:"transparent",border:"none",color:"var(--text-3)",fontSize:"16px",padding:"3px",display:"flex",alignItems:"center",flexShrink:0,transition:"color 0.15s"}}
                  onMouseEnter={e=>e.currentTarget.style.color=agent.color}
                  onMouseLeave={e=>e.currentTarget.style.color="var(--text-3)"}
                  title="Attach image or PDF">📎</button>
                <input ref={fileRef} type="file" accept="image/*,.pdf" multiple onChange={handleFiles} style={{display:"none"}}/>
                <textarea ref={taRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={onKey}
                  placeholder={active==="coordinator"?"What's your day? What's due?":hulkActive?"💪 Pro mode — say what you need...": `Ask ${agent.name}... (say "hulk smash" for Pro mode)`}
                  rows={1}
                  style={{flex:1,background:"transparent",border:"none",outline:"none",color:"var(--text)",fontSize:"13px",fontFamily:"'Sora',sans-serif",resize:"none",lineHeight:"1.5",maxHeight:"100px",overflowY:"auto",fontWeight:"300"}}
                  onInput={e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,100)+"px";}}/>
                <button onClick={()=>send()} disabled={loading||(!input.trim()&&pending.length===0)}
                  style={{width:"30px",height:"30px",borderRadius:"8px",background:(loading||(!input.trim()&&pending.length===0))?"var(--bg)":agent.color,border:`1px solid ${(loading||(!input.trim()&&pending.length===0))?"var(--border)":"transparent"}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.15s",cursor:(loading||(!input.trim()&&pending.length===0))?"not-allowed":"pointer"}}>
                  {loading?<div style={{width:"12px",height:"12px",border:`1.5px solid ${agent.color}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.6s linear infinite"}}/>:
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={(loading||(!input.trim()&&pending.length===0))?"var(--text-3)":"white"} strokeWidth="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                  </svg>}
                </button>
              </div>
              <div style={{fontSize:"10px",color:"var(--text-3)",marginTop:"5px",textAlign:"center",fontWeight:"300"}}>
                Enter to send · Shift+Enter new line · 📎 image or PDF · say "hulk smash" for Pro model
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
